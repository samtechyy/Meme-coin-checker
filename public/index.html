<script>
  fetch('/api/data')
    .then(r => r.json())
    .then(rows => {
      const tbody = document.getElementById('body');
      const note  = document.getElementById('note');
      rows.forEach(r => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${r.date_utc}</td>
          <td>$${Number(r.volume_usd).toLocaleString()}</td>
          <td>V4 $${Number(r.v4_volume_usd || 0).toLocaleString()} · V3 $${Number(r.v3_volume_usd || 0).toLocaleString()}</td>
          <td>${(r.v4_swap_count || 0) + (r.v3_swap_count || 0)}</td>`;
        tbody.appendChild(tr);
        if (r.note) note.textContent = r.note;
      });
    })
    .catch(() => {
      document.getElementById('note').textContent =
        'No data yet. Hit /api/run or wait for the daily cron.';
    });
</script>
